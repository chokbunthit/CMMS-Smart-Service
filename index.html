<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUT CMMS</title>
    <style>
      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <iframe
      id="formframe"
      src=""
      frameborder="0"
      allow="camera *; microphone *"
    ></iframe>
  </body>

  <script>
    const GOOGLE_WEB_APP_URL = `https://script.google.com/macros/s/AKfycbzl-y7G_tbpk7lJMufvP-dyRqcFUEr4Jvd6PsUzAozhbuKK6GCHN5Ph8A1yiF-YNeSUrA/exec`;

    function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const action = urlParams.get("action");
      const field = urlParams.get("field");
      const value = urlParams.get("value");

      let finalUrl = GOOGLE_WEB_APP_URL;

      // ถ้าเป็นการเด้งกลับมาจากหน้าสแกนกล้อง ให้แนบค่าสแกนส่งทะลุเข้าไปใน iframe ด้วย
      if (action === "autofill" && value) {
        finalUrl += `?action=autofill&field=${field}&value=${encodeURIComponent(value)}`;
      }

      document.getElementById("formframe").src = finalUrl;

      // เคลียร์ URL หน้าบนสุดให้สะอาดเพื่อความสวยงาม
      if (action === "autofill") {
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname,
        );
      }
    }
    init();
  </script>
</html>
