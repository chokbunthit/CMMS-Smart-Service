<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUT CMMS</title>
    <style>
      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <iframe
      id="formframe"
      src=""
      frameborder="0"
      allow="camera *; microphone *"
    ></iframe>
  </body>

  <script>
    function runApp() {
      // 1. ตรวจสอบว่าหน้าหลักนี้ ได้รับ Parameter สแกนกลับมาจากหน้ากล้องหรือไม่
      const urlParams = new URLSearchParams(window.location.search);
      const action = urlParams.get("action");
      const field = urlParams.get("field");
      const value = urlParams.get("value");

      // 2. URL ของ Google Web App ของคุณ
      let url = `https://script.google.com/macros/s/AKfycbwmiS0ufEZfdTypn-RfK4sRcCXVezrgs8Qt8TNCEDRmciMCuoSuOPeKTYnQ8o_wA1LyBw/exec`;

      // 3. ถ้าส่งค่ากลับมาจากหน้าสแกน ให้ต่อท้าย Parameter เข้าไปใน iframe ด้วย
      if (action === "autofill" && value) {
        url += `?action=autofill&field=${field}&value=${encodeURIComponent(value)}`;
      }

      // 4. โหลดหน้าฟอร์มเข้า iframe
      document.getElementById("formframe").src = url;

      // 5. เคลียร์ URL บนหน้าเว็บหลักให้สะอาด (User รีเฟรชแล้วค่าเดิมจะไม่กรอกซ้ำ)
      if (action === "autofill") {
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname,
        );
      }
    }
    runApp();
  </script>
</html>
